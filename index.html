<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta
      name="robots"
      content="noindex,nofollow,noarchive,nosnippet,noimageindex"
    />
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0c0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Humanity" />
    <title>Humanity</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./icons/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=33" />
  </head>
  <body>
    <div id="loginView" class="view login-view is-active">
      <div class="login-tools">
        <div class="sq-select" id="loginLangSelect" data-value="zh"></div>
        <button
          type="button"
          class="icon-btn icon-only"
          id="loginThemeBtn"
          aria-label="Theme"
          title="Theme"
        >
          <span class="theme-icon theme-sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path
                d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8l1.8-1.8M18 6l1.8-1.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="theme-icon theme-moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M18.5 14.2A7.2 7.2 0 0 1 9.8 5.5 7.5 7.5 0 1 0 18.5 14.2z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </button>
      </div>
      <form id="loginForm" class="login-card" autocomplete="on">
        <h1 class="brand">Humanity</h1>
        <p class="muted" data-i18n="tagline">Private video library — invite only</p>
        <label>
          <span data-i18n="email">Email</span>
          <input id="email" name="email" type="email" required autocomplete="username" />
        </label>
        <label>
          <span data-i18n="password">Password</span>
          <div class="pwd-wrap">
            <input
              id="password"
              name="password"
              type="password"
              required
              autocomplete="current-password"
            />
            <button type="button" class="pwd-toggle" data-pwd-toggle aria-label="Show password">
              <span class="pwd-eye-show" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              </span>
              <span class="pwd-eye-hide" hidden aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 3l18 18M10.5 10.6A3 3 0 0 0 13.4 13.5M7.1 7.3C4.7 8.7 3 12 3 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M16.9 16.7C19.3 15.3 21 12 21 12s-3.5-7-10-7c-.7 0-1.4.1-2 .2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </span>
            </button>
          </div>
        </label>
        <button type="submit" class="btn primary" id="loginBtn">
          <span class="btn-label" data-i18n="signIn">Sign in</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
        <button type="button" class="text-btn login-secondary" id="showPwdForm" data-i18n="changePassword">
          Change password
        </button>
        <p id="loginErr" class="err" role="alert"></p>
      </form>
      <form id="pwdForm" class="login-card" autocomplete="on" hidden>
        <h1 class="brand">Humanity</h1>
        <p class="muted" data-i18n="changePassword">Change password</p>
        <label>
          <span data-i18n="email">Email</span>
          <input id="pwdEmail" name="email" type="email" required autocomplete="username" />
        </label>
        <label>
          <span data-i18n="currentPassword">Current password</span>
          <div class="pwd-wrap">
            <input id="pwdCurrent" type="password" required autocomplete="current-password" />
            <button type="button" class="pwd-toggle" data-pwd-toggle aria-label="Show password">
              <span class="pwd-eye-show" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              </span>
              <span class="pwd-eye-hide" hidden aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 3l18 18M10.5 10.6A3 3 0 0 0 13.4 13.5M7.1 7.3C4.7 8.7 3 12 3 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M16.9 16.7C19.3 15.3 21 12 21 12s-3.5-7-10-7c-.7 0-1.4.1-2 .2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </span>
            </button>
          </div>
        </label>
        <label>
          <span data-i18n="newPassword">New password</span>
          <div class="pwd-wrap">
            <input id="pwdNew" type="password" required autocomplete="new-password" minlength="8" />
            <button type="button" class="pwd-toggle" data-pwd-toggle aria-label="Show password">
              <span class="pwd-eye-show" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              </span>
              <span class="pwd-eye-hide" hidden aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 3l18 18M10.5 10.6A3 3 0 0 0 13.4 13.5M7.1 7.3C4.7 8.7 3 12 3 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M16.9 16.7C19.3 15.3 21 12 21 12s-3.5-7-10-7c-.7 0-1.4.1-2 .2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </span>
            </button>
          </div>
        </label>
        <label>
          <span data-i18n="confirmPassword">Confirm new password</span>
          <div class="pwd-wrap">
            <input id="pwdConfirm" type="password" required autocomplete="new-password" minlength="8" />
            <button type="button" class="pwd-toggle" data-pwd-toggle aria-label="Show password">
              <span class="pwd-eye-show" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              </span>
              <span class="pwd-eye-hide" hidden aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 3l18 18M10.5 10.6A3 3 0 0 0 13.4 13.5M7.1 7.3C4.7 8.7 3 12 3 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M16.9 16.7C19.3 15.3 21 12 21 12s-3.5-7-10-7c-.7 0-1.4.1-2 .2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </span>
            </button>
          </div>
        </label>
        <button type="submit" class="btn primary" id="pwdSave">
          <span data-i18n="savePassword">Save</span>
        </button>
        <button type="button" class="text-btn login-secondary" id="backToLogin" data-i18n="backToLogin">
          Back to sign in
        </button>
        <p id="pwdErr" class="err" role="alert"></p>
      </form>
    </div>

    <div id="appView" class="view app-view" hidden>
      <header class="top site-top">
        <button
          type="button"
          class="icon-btn icon-only top-profile"
          id="profileBtn"
          title="Profile"
          aria-label="Profile"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle
              cx="12"
              cy="8"
              r="3.2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <path
              d="M5.5 19.2c1.6-3.2 4-4.8 6.5-4.8s4.9 1.6 6.5 4.8"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <h1 class="top-brand">Humanity</h1>
        <div class="top-tools">
          <div class="sq-select lang-select" id="langSelect" data-value="zh"></div>
          <button
            type="button"
            class="icon-btn icon-only"
            id="themeBtn"
            aria-label="Theme"
            title="Theme"
          >
            <span class="theme-icon theme-sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
                <path
                  d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8l1.8-1.8M18 6l1.8-1.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="theme-icon theme-moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M18.5 14.2A7.2 7.2 0 0 1 9.8 5.5 7.5 7.5 0 1 0 18.5 14.2z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </button>
        </div>
        <form id="searchForm" class="search-bar top-search" autocomplete="off">
          <div class="sq-select" id="sourceSelect"></div>
          <input
            id="q"
            name="humanity-q"
            type="search"
            placeholder="Search…"
            enterkeyhint="search"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            data-lpignore="true"
            data-form-type="other"
          />
        </form>
      </header>
      <div class="scroll-pane" id="appScroll">
        <div class="ptr-indicator" id="ptrApp" hidden>Release to refresh</div>
        <p id="status" class="status"></p>
        <main id="results" class="grid" aria-live="polite"></main>
        <nav id="pager" class="pager" hidden>
          <button type="button" class="btn ghost" id="pagePrev" data-i18n="prev">Prev</button>
          <span id="pageLabel" class="page-label">Page 1</span>
          <button type="button" class="btn ghost" id="pageNext" data-i18n="next">Next</button>
        </nav>
      </div>
    </div>

    <div id="favView" class="view fav-view" hidden>
      <header class="top fav-top">
        <button type="button" class="icon-btn" id="backBtn" title="Back" aria-label="Back">←</button>
        <h2 class="page-title" data-i18n="favorites">Favorites</h2>
        <button type="button" class="text-btn" id="logoutBtn" data-i18n="logout">Log out</button>
      </header>
      <div class="scroll-pane" id="favScroll">
        <div class="ptr-indicator" id="ptrFav" hidden>Release to refresh</div>
        <section class="fav-section fav-actors-section" aria-labelledby="favActorsTitle">
          <div class="fav-section-head">
            <h3 id="favActorsTitle" class="fav-section-title" data-i18n="favActors">Actors</h3>
            <button
              type="button"
              class="btn ghost fav-add-actor"
              id="addActorBtn"
              data-i18n="addActor"
            >
              Add actor
            </button>
          </div>
          <form id="actorForm" class="actor-form" hidden>
            <input
              id="actorName"
              type="search"
              enterkeyhint="done"
              autocomplete="off"
              data-i18n-placeholder="actorName"
              placeholder="Actor name"
            />
            <button type="submit" class="btn primary" data-i18n="add">Add</button>
          </form>
          <div id="actorList" class="actor-list"></div>
        </section>
        <section class="fav-section fav-videos-section" aria-labelledby="favVideosTitle">
          <div class="fav-section-head">
            <h3 id="favVideosTitle" class="fav-section-title" data-i18n="favVideos">Videos</h3>
          </div>
          <main id="favList" class="grid"></main>
        </section>
      </div>
    </div>

    <div id="playModal" class="play-modal" hidden aria-hidden="true">
      <iframe
        id="playFrame"
        class="play-frame"
        title="Player"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        referrerpolicy="no-referrer"
      ></iframe>
    </div>

    <script src="./js/config.js?v=33"></script>
    <script src="./js/i18n.js?v=33"></script>
    <script src="./js/api.js?v=33"></script>
    <script src="./js/select.js?v=33"></script>
    <script src="./js/preview.js?v=33"></script>
    <script src="./js/app.js?v=33"></script>
  </body>
</html>
