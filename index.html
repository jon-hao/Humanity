<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta
      name="robots"
      content="noindex,nofollow,noarchive,nosnippet,noimageindex"
    />
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0c0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Humanity" />
    <title>Humanity</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./icons/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=11" />
  </head>
  <body>
    <div id="loginView" class="view login-view is-active">
      <div class="login-tools">
        <div class="sq-select" id="loginLangSelect" data-value="zh"></div>
        <button
          type="button"
          class="icon-btn icon-only"
          id="loginThemeBtn"
          aria-label="Theme"
          title="Theme"
        >
          <span class="theme-icon theme-sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path
                d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8l1.8-1.8M18 6l1.8-1.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="theme-icon theme-moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M18.5 14.2A7.2 7.2 0 0 1 9.8 5.5 7.5 7.5 0 1 0 18.5 14.2z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </button>
      </div>
      <form id="loginForm" class="login-card" autocomplete="on">
        <h1 class="brand">Humanity</h1>
        <p class="muted" data-i18n="tagline">Private video library — invite only</p>
        <label>
          <span data-i18n="email">Email</span>
          <input id="email" name="email" type="email" required autocomplete="username" />
        </label>
        <label>
          <span data-i18n="password">Password</span>
          <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
          />
        </label>
        <button type="submit" class="btn primary" id="loginBtn">
          <span class="btn-label" data-i18n="signIn">Sign in</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
        <p id="loginErr" class="err" role="alert"></p>
      </form>
    </div>

    <div id="appView" class="view app-view" hidden>
      <header class="top">
        <button type="button" class="icon-btn" id="favBtn" title="Favorites" aria-label="Favorites">
          ★
        </button>
        <form id="searchForm" class="search-bar" autocomplete="off">
          <div class="sq-select" id="sourceSelect" data-value="all"></div>
          <input
            id="q"
            name="humanity-q"
            type="search"
            placeholder="Search…"
            enterkeyhint="search"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            data-lpignore="true"
            data-form-type="other"
          />
        </form>
        <button
          type="button"
          class="icon-btn icon-only"
          id="themeBtn"
          aria-label="Theme"
          title="Theme"
        >
          <span class="theme-icon theme-sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path
                d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8l1.8-1.8M18 6l1.8-1.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="theme-icon theme-moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M18.5 14.2A7.2 7.2 0 0 1 9.8 5.5 7.5 7.5 0 1 0 18.5 14.2z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </button>
      </header>
      <div class="scroll-pane" id="appScroll">
        <div class="ptr-indicator" id="ptrApp" hidden>Release to refresh</div>
        <p id="status" class="status"></p>
        <main id="results" class="grid" aria-live="polite"></main>
        <nav id="pager" class="pager" hidden>
          <button type="button" class="btn ghost" id="pagePrev" data-i18n="prev">Prev</button>
          <span id="pageLabel" class="page-label">Page 1</span>
          <button type="button" class="btn ghost" id="pageNext" data-i18n="next">Next</button>
        </nav>
      </div>
    </div>

    <div id="favView" class="view fav-view" hidden>
      <header class="top">
        <button type="button" class="icon-btn" id="backBtn" title="Back" aria-label="Back">←</button>
        <h2 class="page-title" data-i18n="favorites">Favorites</h2>
        <div class="sq-select lang-select" id="langSelect" data-value="zh"></div>
        <button type="button" class="text-btn" id="accountBtn" data-i18n="account">Account</button>
      </header>
      <div class="scroll-pane" id="favScroll">
        <div class="ptr-indicator" id="ptrFav" hidden>Release to refresh</div>
        <main id="favList" class="grid"></main>
      </div>
    </div>

    <div id="modal" class="modal" aria-hidden="true">
      <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
    </div>

    <script src="./js/config.js?v=11"></script>
    <script src="./js/i18n.js?v=11"></script>
    <script src="./js/api.js?v=11"></script>
    <script src="./js/select.js?v=11"></script>
    <script src="./js/preview.js?v=11"></script>
    <script src="./js/app.js?v=11"></script>
  </body>
</html>
