<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta
      name="robots"
      content="noindex,nofollow,noarchive,nosnippet,noimageindex"
    />
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0c0f14" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Player · Humanity</title>
    <style>
      :root {
        color-scheme: dark;
        --sa-top: env(safe-area-inset-top, 0px);
        --sa-right: env(safe-area-inset-right, 0px);
        --sa-bottom: env(safe-area-inset-bottom, 0px);
        --sa-left: env(safe-area-inset-left, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: -webkit-fill-available;
        min-height: 100dvh;
        background: #000;
        overflow: hidden;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: #e8eef8;
        position: fixed;
        inset: 0;
      }
      .player-root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* 画面 + 按钮同一层；竖屏时 JS 旋转铺满 */
      .stage-wrap {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }
      .player-root.is-forced-land .stage-wrap {
        right: auto;
        bottom: auto;
        transform: rotate(90deg);
        transform-origin: center center;
      }
      .stage {
        position: absolute;
        inset: 0;
        background: #000;
        z-index: 1;
      }
      video,
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
        object-fit: contain;
      }
      .gate {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      .gate h1 {
        margin: 0;
        font-size: 1.1rem;
        max-width: 36rem;
      }
      .gate p {
        margin: 0;
        color: #8b97ab;
        font-size: 0.9rem;
        max-width: 36rem;
      }
      .gate a {
        color: #9ec1ff;
      }
      .gate-close {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 120px;
        margin: 4px auto 0;
        padding: 10px 18px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #e8eef8;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
      }
      .play-chrome {
        position: absolute;
        z-index: 6;
        pointer-events: none;
        /* 默认：设备已是横屏 / 桌面 */
        top: max(12px, var(--sa-top, 0px));
        right: max(12px, var(--sa-right, 0px));
        bottom: max(12px, var(--sa-bottom, 0px));
        left: max(12px, var(--sa-left, 0px));
      }
      @media (orientation: landscape) and (max-width: 900px) {
        .play-chrome {
          top: max(20px, var(--sa-top, 0px));
          right: max(16px, var(--sa-right, 0px));
          bottom: max(16px, var(--sa-bottom, 0px));
          left: max(16px, var(--sa-left, 0px));
        }
      }
      /*
        rotate(90deg) CW 后（CSS 坐标 → 横屏画面）：
        left→画面左=物理顶刘海 / right→画面右=物理底 /
        bottom→画面上 / top→画面下
        因此顶栏按钮要贴 CSS bottom，而不是 CSS top。
      */
      .player-root.is-forced-land .play-chrome {
        top: max(12px, var(--sa-right, 0px));
        right: max(16px, var(--sa-bottom, 0px));
        bottom: max(12px, var(--sa-left, 0px));
        left: max(16px, var(--sa-top, 0px));
      }
      .player-root.is-forced-land .gate {
        padding-top: max(24px, calc(var(--sa-right, 0px) + 8px));
        padding-right: max(24px, calc(var(--sa-bottom, 0px) + 8px));
        padding-bottom: max(24px, calc(var(--sa-left, 0px) + 8px));
        padding-left: max(24px, calc(var(--sa-top, 0px) + 8px));
      }
      .play-chrome[hidden] {
        display: none !important;
      }
      .chrome-btn {
        pointer-events: auto;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font-size: 1.05rem;
        line-height: 1;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .chrome-btn:hover {
        background: rgba(0, 0, 0, 0.7);
      }
      .chrome-btn.is-on {
        color: #ff6b8a;
      }
      .chrome-related {
        font-size: 0.85rem;
        font-weight: 700;
      }
      .chrome-left {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        gap: 8px;
        pointer-events: none;
      }
      .chrome-left .chrome-btn {
        pointer-events: auto;
      }
      .chrome-close {
        position: absolute;
        right: 0;
        top: 0;
        font-size: 1.4rem;
      }
      .related-sheet {
        position: absolute;
        inset: 0;
        z-index: 12;
        background: rgba(8, 10, 14, 0.96);
        color: #e8eef8;
        display: flex;
        flex-direction: column;
        pointer-events: auto;
        padding: max(12px, var(--sa-top, 0px)) max(12px, var(--sa-right, 0px))
          max(12px, var(--sa-bottom, 0px)) max(12px, var(--sa-left, 0px));
      }
      .player-root.is-forced-land .related-sheet {
        padding: max(12px, var(--sa-right, 0px)) max(16px, var(--sa-bottom, 0px))
          max(12px, var(--sa-left, 0px)) max(16px, var(--sa-top, 0px));
      }
      .related-sheet[hidden] {
        display: none !important;
      }
      .related-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        flex: 0 0 auto;
      }
      .related-head h2 {
        margin: 0;
        font-size: 1rem;
      }
      .related-body {
        flex: 1;
        overflow: auto;
        padding: 12px;
        -webkit-overflow-scrolling: touch;
      }
      .related-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
      .related-grid .card {
        background: #151a22;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .related-grid .thumb-btn {
        position: relative;
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: #000;
        cursor: pointer;
        aspect-ratio: 16 / 10;
        overflow: hidden;
      }
      .related-grid .thumb-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .related-grid .thumb-btn img.thumb-broken {
        display: none !important;
      }
      .related-grid .thumb-btn.no-thumb {
        background: #11161f;
      }
      .related-grid .thumb-btn .preview-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
        background: #000;
        pointer-events: none;
      }
      .related-grid .thumb-btn.is-previewing .preview-video {
        display: block;
      }
      .related-grid .thumb-btn.is-previewing img {
        opacity: 0;
      }
      .related-grid .src-tag {
        position: absolute;
        left: 8px;
        bottom: 8px;
        font-size: 0.68rem;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.65);
        color: #9ec1ff;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .related-grid .quality-badge {
        position: absolute;
        right: 8px;
        top: 8px;
        font-size: 0.68rem;
        font-weight: 800;
        padding: 3px 7px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.72);
        color: #e8a05c;
        pointer-events: none;
      }
      .related-grid .duration-badge {
        position: absolute;
        right: 8px;
        bottom: 8px;
        font-size: 0.68rem;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.72);
        color: #e8eef8;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      .related-grid .card-body {
        padding: 10px;
        display: grid;
        gap: 8px;
      }
      .related-grid .title {
        margin: 0;
        font-size: 0.85rem;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 2.7em;
      }
      .related-grid .card-actions {
        display: flex;
        gap: 6px;
      }
      .related-grid .btn {
        flex: 1;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #1b2230;
        color: #e8eef8;
        border-radius: 8px;
        padding: 8px;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
      }
      .related-grid .btn.ghost {
        background: transparent;
      }
      .related-grid .btn.danger {
        background: rgba(255, 80, 100, 0.22);
        border-color: rgba(255, 107, 138, 0.45);
      }
      .related-grid .btn-open {
        flex: 0 0 auto;
        min-width: 42px;
        padding-left: 10px;
        padding-right: 10px;
      }
      .related-empty {
        text-align: center;
        color: #8b97ab;
        padding: 40px 12px;
        font-size: 0.9rem;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="./js/config.js?v=33"></script>
    <script src="./js/api.js?v=33"></script>
    <script src="./js/preview.js?v=33"></script>
  </head>
  <body>
    <div class="player-root">
      <div class="stage-wrap" id="stageWrap">
        <div class="stage" id="stage"></div>
        <div class="play-chrome" id="chrome" hidden>
          <div class="chrome-left">
            <button type="button" class="chrome-btn" id="favBtn" aria-label="Favorite" title="Favorite">
              ♥
            </button>
            <button
              type="button"
              class="chrome-btn chrome-related"
              id="relatedBtn"
              aria-label="Related"
              title="Related"
            >
              荐
            </button>
          </div>
          <button type="button" class="chrome-btn chrome-close" id="closeBtn" aria-label="Close">
            ×
          </button>
        </div>
        <div class="related-sheet" id="relatedSheet" hidden>
          <div class="related-head">
            <h2 id="relatedTitle">Related</h2>
            <button type="button" class="chrome-btn" id="relatedClose" aria-label="Close">×</button>
          </div>
          <div class="related-body" id="relatedBody"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const PLAY_STORE_PREFIX = "humanity-play:";
        const p = new URLSearchParams(location.search);
        const id = p.get("id") || "";
        let title = p.get("title") || "Video";
        const stage = document.getElementById("stage");
        const chrome = document.getElementById("chrome");
        const favBtn = document.getElementById("favBtn");
        const relatedBtn = document.getElementById("relatedBtn");
        const closeBtn = document.getElementById("closeBtn");
        const relatedSheet = document.getElementById("relatedSheet");
        const relatedBody = document.getElementById("relatedBody");
        const relatedClose = document.getElementById("relatedClose");
        const relatedTitle = document.getElementById("relatedTitle");
        let hlsObj = null;
        let poster = "";
        let playCtx = null;
        let saved = false;
        let relatedLoaded = false;
        const inFrame = (function () {
          try {
            return window.parent && window.parent !== window;
          } catch (_) {
            return true;
          }
        })();

        function esc(s) {
          return String(s || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/"/g, "&quot;");
        }

        function applySafeAreaInsets(o) {
          if (!o || typeof o !== "object") return;
          const root = document.documentElement.style;
          const set = (key, val) => {
            const n = Number(val);
            if (!Number.isFinite(n) || n < 0) return;
            root.setProperty(key, n + "px");
          };
          set("--sa-top", o.top);
          set("--sa-right", o.right);
          set("--sa-bottom", o.bottom);
          set("--sa-left", o.left);
        }

        function applySafeAreaFromParent() {
          // 优先 URL 参数（父页打开时写入），再读 localStorage；iframe 内 env 不可靠
          try {
            const rawSa = p.get("sa");
            if (rawSa) {
              const parts = String(rawSa).split(",");
              if (parts.length === 4) {
                applySafeAreaInsets({
                  top: parts[0],
                  right: parts[1],
                  bottom: parts[2],
                  left: parts[3],
                });
                return;
              }
            }
          } catch (_) {}
          try {
            const raw = localStorage.getItem("humanity-safe-area");
            if (!raw) return;
            applySafeAreaInsets(JSON.parse(raw));
          } catch (_) {}
        }

        function syncForcedLandscapeSize() {
          const wrap = document.getElementById("stageWrap");
          const root = document.querySelector(".player-root");
          if (!wrap || !root) return;
          // 取多种视口量里的最大值，避免 iOS iframe/地址栏让一边偏短 → 右侧黑边
          const vw = Math.ceil(
            Math.max(
              root.clientWidth,
              root.offsetWidth,
              window.innerWidth || 0,
              document.documentElement.clientWidth || 0,
              (window.visualViewport && window.visualViewport.width) || 0
            )
          );
          const vh = Math.ceil(
            Math.max(
              root.clientHeight,
              root.offsetHeight,
              window.innerHeight || 0,
              document.documentElement.clientHeight || 0,
              (window.visualViewport && window.visualViewport.height) || 0
            )
          );
          const forced = vw > 0 && vh > 0 && vh > vw && Math.min(vw, vh) <= 900;
          if (!forced) {
            root.classList.remove("is-forced-land");
            wrap.style.cssText = "";
            return;
          }
          // 居中旋转；多加 2px 吃掉亚像素缝
          const rw = vh + 2;
          const rh = vw + 2;
          root.classList.add("is-forced-land");
          wrap.style.cssText =
            "position:absolute;right:auto;bottom:auto;margin:0;" +
            "width:" +
            rw +
            "px;height:" +
            rh +
            "px;left:" +
            (vw - rw) / 2 +
            "px;top:" +
            (vh - rh) / 2 +
            "px;transform:rotate(90deg);transform-origin:center center;background:#000;";
        }

        function showChrome(on) {
          if (!chrome) return;
          chrome.hidden = !on;
        }

        function clearMedia() {
          Array.from(stage.children).forEach((el) => {
            el.remove();
          });
        }

        function canNativeHls() {
          try {
            const v = document.createElement("video");
            return !!v.canPlayType("application/vnd.apple.mpegurl");
          } catch (_) {
            return false;
          }
        }

        function showGate(msg, linkMode) {
          showChrome(true);
          clearMedia();
          let extra = "";
          if (linkMode === "signin") {
            extra = '<p><a href="./">Sign in</a></p>';
          } else if (linkMode === "home") {
            extra = '<p><a href="./">Back</a></p>';
          }
          const gate = document.createElement("div");
          gate.className = "gate";
          gate.innerHTML =
            "<h1>" +
            esc(title) +
            "</h1><p>" +
            esc(msg || "Unable to play") +
            "</p>" +
            extra +
            '<button type="button" class="gate-close" data-gate-close>Close</button>';
          stage.appendChild(gate);
          const close = gate.querySelector("[data-gate-close]");
          if (close) close.addEventListener("click", closePlayer);
        }

        function isPlayableMediaUrl(url) {
          const s = String(url || "");
          if (!s || !/^https?:/i.test(s)) return false;
          if (/[?&]flow=hmedia\b/i.test(s)) return true;
          if (/\.(mp4|webm|m3u8)(\?|#|$)/i.test(s)) return true;
          if (/\/dload\/[^/]+\/\d{3,4}\/?/i.test(s)) return true;
          if (/\/hls\//i.test(s)) return true;
          if (/get_media\?/i.test(s)) return true;
          // 代理 URL 里原始地址被 encode 进 u=
          if (/[?&]u=https?%3A%2F%2F[^&]*%2E(m3u8|mp4|webm)/i.test(s)) return true;
          if (/[?&]u=https?%3A%2F%2F[^&]*\.(m3u8|mp4|webm)/i.test(s)) return true;
          return false;
        }

        function isMissavCtx() {
          return !!(
            playCtx &&
            (playCtx.source === "ch4" ||
              /missav|surrit/i.test(
                String(playCtx.source || "") + String(playCtx.page || "")
              ))
          );
        }

        function destroyHls() {
          if (hlsObj) {
            try {
              hlsObj.destroy();
            } catch (_) {}
            hlsObj = null;
          }
        }

        function lockHlsMax(hls, levels) {
          if (!hls || !levels || !levels.length) return;
          const max = levels.length - 1;
          try {
            hls.autoLevelEnabled = false;
          } catch (_) {}
          hls.startLevel = max;
          hls.currentLevel = max;
          hls.loadLevel = max;
          hls.nextLevel = max;
        }

        function openExternalPage(url) {
          if (!url) return false;
          try {
            window.open(url, "_blank", "noopener");
            return true;
          } catch (_) {
            return false;
          }
        }

        function missavPlayerUrl(explicit) {
          if (explicit) return explicit;
          if (playCtx && playCtx.page) return playCtx.page;
          return null;
        }

        function sourceEmbedUrl(explicit) {
          if (explicit) return explicit;
          if (isMissavCtx()) return missavPlayerUrl(null);
          return null;
        }

        function canPlayMediaSrc(src) {
          const s = String(src || "");
          if (!s) return false;
          if (/\.m3u8(\?|#|$)/i.test(s) || /[?&]flow=hmedia\b/i.test(s)) {
            return canNativeHls() || !!(window.Hls && window.Hls.isSupported());
          }
          return true;
        }

        function showMissavFallback(msg) {
          const page = missavPlayerUrl(null);
          if (page) {
            mountIframe(page, { sourceSite: true });
            return;
          }
          showChrome(true);
          clearMedia();
          const gate = document.createElement("div");
          gate.className = "gate";
          gate.innerHTML =
            "<h1>" +
            esc(title) +
            "</h1><p>" +
            esc(msg || "Stream unavailable") +
            "</p>" +
            '<button type="button" class="gate-close" data-gate-close>Close</button>';
          stage.appendChild(gate);
          const close = gate.querySelector("[data-gate-close]");
          if (close) close.addEventListener("click", closePlayer);
        }

        function mountVideo(src, fallbackEmbed, opts) {
          destroyHls();
          const fallback = sourceEmbedUrl(fallbackEmbed);
          const altStream = opts && opts.altStream ? opts.altStream : null;
          if (!canPlayMediaSrc(src)) {
            if (altStream && altStream !== src) {
              mountVideo(altStream, fallbackEmbed, null);
              return;
            }
            if (fallback) mountIframe(fallback, { sourceSite: isMissavCtx() });
            else if (isMissavCtx()) showMissavFallback("Video not supported");
            else showGate("Video not supported");
            return;
          }
          clearMedia();
          showChrome(true);
          syncForcedLandscapeSize();
          const video = document.createElement("video");
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          video.setAttribute("playsinline", "");
          video.setAttribute("webkit-playsinline", "");
          if (poster) video.poster = poster;
          let fellBack = false;
          const onFail = function () {
            if (fellBack) return;
            destroyHls();
            if (altStream && altStream !== src) {
              fellBack = true;
              mountVideo(altStream, fallbackEmbed, null);
              return;
            }
            fellBack = true;
            if (fallback) mountIframe(fallback, { sourceSite: isMissavCtx() });
            else if (isMissavCtx()) {
              showMissavFallback("Video stream unavailable");
            } else showGate("Video stream unavailable");
          };
          video.addEventListener("error", onFail);
          const stallTimer = setTimeout(function () {
            if (fellBack) return;
            if (video.readyState >= 2) return;
            onFail();
          }, 10000);
          video.addEventListener("loadeddata", function () {
            clearTimeout(stallTimer);
          });
          stage.appendChild(video);

          const isHls =
            /\.m3u8(\?|#|$)/i.test(src) || /[?&]flow=hmedia\b/i.test(src);
          if (isHls) {
            if (video.canPlayType("application/vnd.apple.mpegurl")) {
              video.src = src;
              video.play().catch(function () {});
            } else if (window.Hls && window.Hls.isSupported()) {
              hlsObj = new window.Hls({
                enableWorker: true,
                startLevel: -1,
                capLevelToPlayerSize: false,
                abrEwmaDefaultEstimate: 1e7,
              });
              hlsObj.loadSource(src);
              hlsObj.attachMedia(video);
              hlsObj.on(window.Hls.Events.MANIFEST_PARSED, function (_e, data) {
                clearTimeout(stallTimer);
                lockHlsMax(hlsObj, data && data.levels);
                video.play().catch(function () {});
              });
              hlsObj.on(window.Hls.Events.ERROR, function (_e, data) {
                if (data && data.fatal) onFail();
              });
            } else {
              onFail();
            }
          } else {
            video.src = src;
            video.play().catch(function () {});
          }
        }

        function mountIframe(src, opts) {
          destroyHls();
          if (!src) {
            showGate("No playable URL");
            return;
          }
          clearMedia();
          showChrome(true);
          syncForcedLandscapeSize();
          const sourceSite = !!(opts && opts.sourceSite);
          const iframe = document.createElement("iframe");
          iframe.src = src;
          iframe.allow =
            "autoplay; fullscreen; picture-in-picture; encrypted-media";
          iframe.allowFullscreen = true;
          // 源站播放器需要正常 referrer / 完整脚本环境
          iframe.referrerPolicy = sourceSite
            ? "no-referrer-when-downgrade"
            : "no-referrer";
          if (!sourceSite) {
            // 非源站 embed：禁弹窗减广告；MissAV 等源站页不加 sandbox
            iframe.setAttribute(
              "sandbox",
              "allow-scripts allow-same-origin allow-forms allow-presentation allow-downloads"
            );
          }
          stage.appendChild(iframe);
        }

        function readStore(key) {
          try {
            const a = localStorage.getItem(key);
            if (a) return a;
          } catch (_) {}
          try {
            return sessionStorage.getItem(key);
          } catch (_) {
            return null;
          }
        }

        function writeStore(key, value) {
          try {
            localStorage.setItem(key, value);
          } catch (_) {}
          try {
            sessionStorage.setItem(key, value);
          } catch (_) {}
        }

        function readPlayContext(playId) {
          if (!playId) return null;
          try {
            const raw = readStore(PLAY_STORE_PREFIX + playId);
            if (!raw) return null;
            const data = JSON.parse(raw);
            return data && typeof data === "object" ? data : null;
          } catch (_) {
            return null;
          }
        }

        function stashItem(item) {
          const payload = JSON.stringify({
            id: item.id,
            page: item.url || item.page || null,
            embed: item.embed || null,
            source: item.source || null,
            title: item.title || null,
            poster: item.thumb || item.poster || null,
            preview: item.preview || null,
            duration: item.duration || null,
            quality: item.quality || null,
            at: Date.now(),
          });
          writeStore(PLAY_STORE_PREFIX + item.id, payload);
        }

        function favItemFromCtx() {
          if (!playCtx || !id) return null;
          return {
            id: id,
            source: playCtx.source || null,
            title: playCtx.title || title,
            thumb: playCtx.poster || null,
            preview: playCtx.preview || playCtx.poster || null,
            url: playCtx.page || null,
            embed: playCtx.embed || null,
            duration: playCtx.duration || null,
            quality: playCtx.quality || null,
          };
        }

        function syncFavBtn() {
          if (!favBtn) return;
          favBtn.classList.toggle("is-on", !!saved);
          favBtn.setAttribute("aria-pressed", saved ? "true" : "false");
          favBtn.title = saved ? "Unsave" : "Save";
        }

        async function refreshSaved() {
          if (!id || !window.HumanityAPI || !window.HumanityAPI.hasFavorite) {
            saved = false;
            syncFavBtn();
            return;
          }
          try {
            const d = await window.HumanityAPI.hasFavorite(id);
            saved = !!(d && d.saved);
          } catch (_) {
            saved = false;
          }
          syncFavBtn();
        }

        async function toggleFav() {
          const item = favItemFromCtx();
          if (!item || !window.HumanityAPI) return;
          try {
            if (saved) {
              await window.HumanityAPI.removeFavorite(item.id);
              saved = false;
            } else {
              await window.HumanityAPI.addFavorite(item);
              saved = true;
            }
            syncFavBtn();
          } catch (err) {
            if (err && err.code === 401) {
              showGate("Sign in required to play", "signin");
            }
          }
        }

        function closePlayer() {
          if (inFrame) {
            try {
              window.parent.postMessage(
                { type: "humanity-play-close" },
                "*"
              );
            } catch (_) {}
            return;
          }
          location.href = "./";
        }

        function closeRelated() {
          if (relatedSheet) relatedSheet.hidden = true;
        }

        function playerHref(item) {
          stashItem(item);
          const u = new URL("player.html", location.href);
          if (item.id) u.searchParams.set("id", item.id);
          if (item.title) u.searchParams.set("title", item.title);
          return u.href;
        }

        function openRelatedCard(item) {
          if (!item || !item.id) return;
          location.href = playerHref(item);
        }

        function t(key) {
          const lang = localStorage.getItem("humanity-lang") || "zh";
          const pack = {
            zh: {
              related: "相关推荐",
              loading: "加载中…",
              empty: "暂无相关影片",
              fail: "加载失败",
              save: "收藏",
              unsave: "取消收藏",
              openWindow: "新窗口",
            },
            "zh-TW": {
              related: "相關推薦",
              loading: "載入中…",
              empty: "尚無相關影片",
              fail: "載入失敗",
              save: "收藏",
              unsave: "取消收藏",
              openWindow: "新視窗",
            },
            en: {
              related: "Related",
              loading: "Loading…",
              empty: "No related videos",
              fail: "Failed to load",
              save: "Save",
              unsave: "Unsave",
              openWindow: "New window",
            },
          };
          const table = pack[lang] || pack.zh;
          return table[key] || pack.en[key] || key;
        }

        function relatedCardHtml(item) {
          const thumb = item.thumb || "";
          const preview = item.preview || thumb;
          const channel = item.sourceLabel || item.source || "";
          const duration = item.duration ? String(item.duration) : "";
          const quality = item.quality ? String(item.quality) : "";
          return (
            '<article class="card" data-id="' +
            esc(item.id) +
            '">' +
            '<button type="button" class="thumb-btn" data-open data-thumb="' +
            esc(thumb) +
            '" data-preview="' +
            esc(preview) +
            '">' +
            '<img src="' +
            esc(thumb) +
            '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-fallback />' +
            (channel
              ? '<span class="src-tag">' + esc(channel) + "</span>"
              : "") +
            (quality
              ? '<span class="quality-badge">' + esc(quality) + "</span>"
              : "") +
            (duration
              ? '<span class="duration-badge">' + esc(duration) + "</span>"
              : "") +
            "</button>" +
            '<div class="card-body">' +
            '<h3 class="title">' +
            esc(item.title || "") +
            "</h3>" +
            '<div class="card-actions">' +
            '<button type="button" class="btn" data-fav>' +
            esc(t("save")) +
            "</button>" +
            '<button type="button" class="btn ghost btn-open" data-open-tab title="' +
            esc(t("openWindow")) +
            '" aria-label="' +
            esc(t("openWindow")) +
            '">↗</button>' +
            "</div></div></article>"
          );
        }

        function wireRelatedThumbFallback(root) {
          root.querySelectorAll("img[data-fallback]").forEach(function (img) {
            if (img.dataset.fbWired) return;
            img.dataset.fbWired = "1";
            const btn = img.closest(".thumb-btn");
            const primary = img.getAttribute("src") || "";
            const preview =
              (btn && btn.getAttribute("data-preview")) || "";
            const queue = [];
            const seen = {};
            function pushAlt(u) {
              const s = String(u || "").trim();
              if (!s || seen[s] || s === primary) return;
              seen[s] = 1;
              queue.push(s);
            }
            if (/THUMBNUM/i.test(primary)) {
              ["16", "9", "8", "1", "15", "5"].forEach(function (n) {
                pushAlt(primary.replace(/THUMBNUM/gi, n));
              });
            }
            if (/\.(jpe?g|png|webp)(\?|#|$)/i.test(preview)) pushAlt(preview);
            let primaryRetries = 0;
            if (!primary) {
              img.classList.add("thumb-broken");
              if (btn) btn.classList.add("no-thumb");
              return;
            }
            img.addEventListener("error", function onErr() {
              const cur = img.getAttribute("src") || "";
              if (cur === primary && primaryRetries < 1) {
                primaryRetries += 1;
                img.removeAttribute("src");
                requestAnimationFrame(function () {
                  img.src = primary;
                });
                return;
              }
              if (queue.length) {
                img.src = queue.shift();
                return;
              }
              img.removeEventListener("error", onErr);
              img.removeAttribute("src");
              img.classList.add("thumb-broken");
              if (btn) btn.classList.add("no-thumb");
            });
          });
        }

        function wireRelatedCards(items) {
          const byId = {};
          items.forEach(function (i) {
            byId[i.id] = i;
          });
          relatedBody.querySelectorAll(".card").forEach(function (card) {
            const item = byId[card.dataset.id];
            if (!item) return;
            card.querySelectorAll("[data-open]").forEach(function (btn) {
              btn.addEventListener("click", function (e) {
                e.preventDefault();
                openRelatedCard(item);
              });
            });
            const tabBtn = card.querySelector("[data-open-tab]");
            if (tabBtn) {
              tabBtn.addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                window.open(playerHref(item), "_blank", "noopener");
              });
            }
            const favBtn = card.querySelector("[data-fav]");
            if (favBtn) {
              favBtn.addEventListener("click", async function (e) {
                e.preventDefault();
                e.stopPropagation();
                try {
                  if (favBtn.classList.contains("danger")) {
                    await window.HumanityAPI.removeFavorite(item.id);
                    favBtn.classList.remove("danger");
                    favBtn.textContent = t("save");
                    if (item.id === id) {
                      saved = false;
                      syncFavBtn();
                    }
                  } else {
                    await window.HumanityAPI.addFavorite(item);
                    favBtn.classList.add("danger");
                    favBtn.textContent = t("unsave");
                    if (item.id === id) {
                      saved = true;
                      syncFavBtn();
                    }
                  }
                } catch (err) {
                  if (err && err.code === 401) {
                    showGate("Sign in required to play", "signin");
                  }
                }
              });
            }
          });
          wireRelatedThumbFallback(relatedBody);
          if (window.HumanityPreview) window.HumanityPreview.bind(relatedBody);
        }

        async function openRelated() {
          if (!relatedSheet || !relatedBody) return;
          relatedSheet.hidden = false;
          if (relatedTitle) relatedTitle.textContent = t("related");
          if (!relatedLoaded) {
            relatedBody.innerHTML =
              '<div class="related-empty">' + esc(t("loading")) + "</div>";
            try {
              const d = await window.HumanityAPI.related({
                page: playCtx && playCtx.page,
                source: playCtx && playCtx.source,
              });
              const items = (d && d.items) || [];
              relatedLoaded = true;
              if (!items.length) {
                relatedBody.innerHTML =
                  '<div class="related-empty">' + esc(t("empty")) + "</div>";
                return;
              }
              relatedBody.innerHTML =
                '<div class="related-grid">' +
                items.map(relatedCardHtml).join("") +
                "</div>";
              wireRelatedCards(items);
            } catch (err) {
              relatedBody.innerHTML =
                '<div class="related-empty">' +
                esc((err && err.message) || t("fail")) +
                "</div>";
            }
          }
        }

        if (favBtn) favBtn.addEventListener("click", toggleFav);
        if (relatedBtn) relatedBtn.addEventListener("click", openRelated);
        if (closeBtn) closeBtn.addEventListener("click", closePlayer);
        if (relatedClose) relatedClose.addEventListener("click", closeRelated);

        async function start() {
          showGate("Loading…");

          const authed =
            window.HumanityAPI &&
            window.HumanityAPI.getToken &&
            !!window.HumanityAPI.getToken();

          if (!authed) {
            showGate("Sign in required to play", "signin");
            return;
          }

          if (!id) {
            showGate("Missing video", "home");
            return;
          }

          playCtx = readPlayContext(id);
          if (!playCtx || (!playCtx.page && !playCtx.embed)) {
            showGate("Open a video from the library", "home");
            return;
          }

          if (playCtx.title) {
            title = playCtx.title;
            document.title = title + " · Humanity";
          }
          if (playCtx.poster) poster = playCtx.poster;

          let embed = playCtx.embed || null;
          let stream = null;
          let source = playCtx.source || null;

          refreshSaved();

          let playMeta = null;
          try {
            const d = await window.HumanityAPI.resolvePlay({
              page: playCtx.page || null,
              embed: embed,
              source: source,
            });
            playMeta = d;
            if (d && d.stream) stream = d.stream;
            else if (d && d.hls) stream = d.hls;
            if (d && d.embed) embed = d.embed;
            if (d && d.source) {
              source = d.source;
              playCtx.source = d.source;
            }
          } catch (err) {
            if (err && err.code === 401) {
              showGate("Sign in required to play", "signin");
              return;
            }
            showGate(
              String((err && err.message) || "Unable to resolve stream"),
              "home"
            );
            return;
          }

          // ch3（Eporner）不适合 video，强制 embed
          const forceEmbed = source === "ch3" || /eporner/i.test(String(embed || ""));

          const rawPlayable = !forceEmbed && isPlayableMediaUrl(stream);
          const missav = isMissavCtx() || (playMeta && playMeta.proxy);

          // MissAV：直接用源站自己的播放器（页面或解析出的 embed）
          if (missav) {
            const player = missavPlayerUrl(embed);
            if (player) {
              mountIframe(player, { sourceSite: true });
              return;
            }
          }

          const fallback = sourceEmbedUrl(embed);
          if (rawPlayable && stream && canPlayMediaSrc(stream)) {
            if (
              window.HumanityAPI.needsMediaProxy &&
              window.HumanityAPI.needsMediaProxy(stream, playMeta)
            ) {
              stream = window.HumanityAPI.mediaUrl(stream);
            }
            mountVideo(stream, fallback);
            return;
          }
          if (fallback) {
            mountIframe(fallback, { sourceSite: missav });
            return;
          }
          showGate("No playable URL");
        }

        document.title = title + " · Humanity";
        applySafeAreaFromParent();
        function layoutSoon() {
          syncForcedLandscapeSize();
          requestAnimationFrame(syncForcedLandscapeSize);
        }
        layoutSoon();
        window.addEventListener("resize", layoutSoon);
        window.addEventListener("orientationchange", function () {
          setTimeout(layoutSoon, 50);
          setTimeout(layoutSoon, 300);
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", layoutSoon);
        }
        start();
      })();
    </script>
  </body>
</html>
