<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="robots" content="noindex,nofollow" />
    <title>Player · Humanity</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0f14;
        overflow: hidden;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: #e8eef8;
      }
      .stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        .stage.has-media {
          width: 100vh;
          height: 100vw;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%) rotate(90deg);
          transform-origin: center center;
        }
      }
      video,
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
        object-fit: contain;
      }
      .gate {
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .gate h1 {
        margin: 0;
        font-size: 1.1rem;
      }
      .gate p {
        margin: 0;
        color: #8b97ab;
        font-size: 0.9rem;
        max-width: 36rem;
      }
      .gate a,
      .gate button {
        font: inherit;
        cursor: pointer;
      }
      .gate .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        border: 0;
        border-radius: 8px;
        padding: 12px 18px;
        background: linear-gradient(135deg, #c45c26, #a34820);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .gate .link {
        color: #9ad;
        background: none;
        border: 0;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage"></div>
    <script>
      (function () {
        const p = new URLSearchParams(location.search);
        const embed = p.get("embed");
        const page = p.get("page");
        const title = p.get("title") || "Video";
        const source = p.get("source") || "";
        const target = page || embed;
        document.title = title + " · Humanity";
        const stage = document.getElementById("stage");

        function openTop(url) {
          // 多数成人站禁止 iframe（X-Frame-Options / 拒连）。顶层跳转才能播。
          location.replace(url);
        }

        if (!target) {
          stage.innerHTML =
            '<div class="gate"><h1>No playable URL</h1></div>';
          return;
        }

        // 已知会拒嵌的源：直接顶层打开，避免空白拒连页
        if (/eporner|pornhub|xvideos/i.test(source) || /eporner|pornhub|xvideos/i.test(target)) {
          stage.innerHTML =
            '<div class="gate">' +
            "<h1>" +
            title.replace(/</g, "&lt;") +
            "</h1>" +
            "<p>This source blocks embedded players. Opening the original page…</p>" +
            '<a class="btn" id="go" href="' +
            target.replace(/"/g, "&quot;") +
            '">Continue</a>' +
            "</div>";
          const go = document.getElementById("go");
          // 立刻跳转；保留按钮兜底
          setTimeout(function () {
            openTop(target);
          }, 200);
          go.addEventListener("click", function (e) {
            e.preventDefault();
            openTop(target);
          });
          return;
        }

        // 其他源仍尝试 iframe
        stage.classList.add("has-media");
        const iframe = document.createElement("iframe");
        iframe.src = embed || page;
        iframe.allow =
          "autoplay; fullscreen; picture-in-picture; encrypted-media";
        iframe.allowFullscreen = true;
        iframe.referrerPolicy = "no-referrer";
        let settled = false;
        const fallback = setTimeout(function () {
          if (settled) return;
          settled = true;
          openTop(target);
        }, 2500);
        iframe.addEventListener("load", function () {
          settled = true;
          clearTimeout(fallback);
        });
        stage.appendChild(iframe);
      })();
    </script>
  </body>
</html>
