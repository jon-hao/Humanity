<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta
      name="robots"
      content="noindex,nofollow,noarchive,nosnippet,noimageindex"
    />
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0c0f14" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Player · Humanity</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0f14;
        overflow: hidden;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: #e8eef8;
      }
      .stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        .stage.has-media {
          width: 100vh;
          height: 100vw;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%) rotate(90deg);
          transform-origin: center center;
        }
      }
      video,
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
        object-fit: contain;
      }
      .gate {
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .gate h1 {
        margin: 0;
        font-size: 1.1rem;
      }
      .gate p {
        margin: 0;
        color: #8b97ab;
        font-size: 0.9rem;
        max-width: 36rem;
      }
      .gate a {
        color: #9ec1ff;
      }
      .quality-tag {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 5;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #e8a05c;
        font-size: 0.72rem;
        font-weight: 700;
        pointer-events: none;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="./js/config.js?v=15"></script>
    <script src="./js/api.js?v=15"></script>
  </head>
  <body>
    <div class="stage" id="stage"></div>
    <script>
      (function () {
        const PLAY_STORE_PREFIX = "humanity-play:";
        const p = new URLSearchParams(location.search);
        const id = p.get("id") || "";
        let title = p.get("title") || "Video";
        const stage = document.getElementById("stage");
        let hlsObj = null;
        let poster = "";

        function showGate(msg, linkMode) {
          stage.classList.remove("has-media");
          let extra = "";
          if (linkMode === "signin") {
            extra = '<p><a href="./">Sign in</a></p>';
          } else if (linkMode === "home") {
            extra = '<p><a href="./">Back</a></p>';
          }
          stage.innerHTML =
            '<div class="gate"><h1>' +
            String(title).replace(/</g, "&lt;") +
            "</h1><p>" +
            String(msg || "Unable to play").replace(/</g, "&lt;") +
            "</p>" +
            extra +
            "</div>";
        }

        function showQuality(q) {
          if (!q) return;
          const tag = document.createElement("div");
          tag.className = "quality-tag";
          tag.textContent = q;
          document.body.appendChild(tag);
        }

        function destroyHls() {
          if (hlsObj) {
            try {
              hlsObj.destroy();
            } catch (_) {}
            hlsObj = null;
          }
        }

        function mountVideo(src, fallbackEmbed, quality) {
          destroyHls();
          stage.classList.add("has-media");
          stage.innerHTML = "";
          const video = document.createElement("video");
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          video.setAttribute("playsinline", "");
          if (poster) video.poster = poster;
          let fellBack = false;
          const onFail = function () {
            if (fellBack) return;
            fellBack = true;
            destroyHls();
            if (fallbackEmbed) mountIframe(fallbackEmbed);
            else showGate("Video stream unavailable");
          };
          video.addEventListener("error", onFail);
          stage.appendChild(video);
          showQuality(quality);

          const isHls = /\.m3u8(\?|#|$)/i.test(src);
          if (isHls) {
            if (video.canPlayType("application/vnd.apple.mpegurl")) {
              video.src = src;
            } else if (window.Hls && window.Hls.isSupported()) {
              hlsObj = new window.Hls({
                enableWorker: true,
                startLevel: -1,
              });
              hlsObj.loadSource(src);
              hlsObj.attachMedia(video);
              hlsObj.on(window.Hls.Events.MANIFEST_PARSED, function (_e, data) {
                if (data && data.levels && data.levels.length) {
                  hlsObj.currentLevel = data.levels.length - 1;
                  const lv = data.levels[data.levels.length - 1];
                  if (lv && lv.height) showQuality(lv.height + "p");
                }
                video.play().catch(function () {});
              });
              hlsObj.on(window.Hls.Events.ERROR, function (_e, data) {
                if (data && data.fatal) onFail();
              });
            } else {
              onFail();
            }
          } else {
            video.src = src;
          }
        }

        function mountIframe(src) {
          destroyHls();
          if (!src) {
            showGate("No playable URL");
            return;
          }
          stage.classList.add("has-media");
          stage.innerHTML = "";
          const iframe = document.createElement("iframe");
          iframe.src = src;
          iframe.allow =
            "autoplay; fullscreen; picture-in-picture; encrypted-media";
          iframe.allowFullscreen = true;
          iframe.referrerPolicy = "no-referrer";
          stage.appendChild(iframe);
        }

        function readStore(key) {
          try {
            const a = localStorage.getItem(key);
            if (a) return a;
          } catch (_) {}
          try {
            return sessionStorage.getItem(key);
          } catch (_) {
            return null;
          }
        }

        function readPlayContext(playId) {
          if (!playId) return null;
          try {
            const raw = readStore(PLAY_STORE_PREFIX + playId);
            if (!raw) return null;
            const data = JSON.parse(raw);
            return data && typeof data === "object" ? data : null;
          } catch (_) {
            return null;
          }
        }

        async function start() {
          showGate("Loading…");

          const authed =
            window.HumanityAPI &&
            window.HumanityAPI.getToken &&
            !!window.HumanityAPI.getToken();

          if (!authed) {
            showGate("Sign in required to play", "signin");
            return;
          }

          if (!id) {
            showGate("Missing video", "home");
            return;
          }

          const ctx = readPlayContext(id);
          if (!ctx || (!ctx.page && !ctx.embed)) {
            showGate("Open a video from the library", "home");
            return;
          }

          if (ctx.title) {
            title = ctx.title;
            document.title = title + " · Humanity";
          }
          if (ctx.poster) poster = ctx.poster;

          let embed = ctx.embed || null;
          let stream = null;
          let quality = null;

          try {
            const d = await window.HumanityAPI.resolvePlay({
              page: ctx.page || null,
              embed: embed,
              source: ctx.source || null,
            });
            if (d && d.stream) stream = d.stream;
            else if (d && d.hls) stream = d.hls;
            if (d && d.embed) embed = d.embed;
            if (d && d.quality) quality = d.quality;
          } catch (err) {
            if (err && err.code === 401) {
              showGate("Sign in required to play", "signin");
              return;
            }
            showGate(String((err && err.message) || "Unable to resolve stream"), "home");
            return;
          }

          if (stream && /\.(mp4|webm|m3u8)(\?|#|$)/i.test(stream)) {
            mountVideo(stream, embed, quality);
            return;
          }
          if (embed) {
            mountIframe(embed);
            return;
          }
          showGate("No playable URL");
        }

        document.title = title + " · Humanity";
        start();
      })();
    </script>
  </body>
</html>
