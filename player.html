<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="robots" content="noindex,nofollow" />
    <title>Player · Humanity</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
      }
      .stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
      /* 移动端竖屏时旋转为横屏视觉（浏览器窗口级，非系统全屏） */
      @media (orientation: portrait) and (max-width: 900px) {
        .stage {
          width: 100vh;
          height: 100vw;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%) rotate(90deg);
          transform-origin: center center;
        }
      }
      video,
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
        object-fit: contain;
      }
      .bar {
        position: fixed;
        z-index: 5;
        left: 0;
        right: 0;
        top: 0;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), transparent);
        color: #fff;
        font-size: 0.85rem;
        pointer-events: none;
      }
      .bar a {
        pointer-events: auto;
        color: #9ad;
      }
      .err {
        color: #f88;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar"></div>
    <div class="stage" id="stage"></div>
    <script>
      (function () {
        const p = new URLSearchParams(location.search);
        const embed = p.get("embed");
        const page = p.get("page");
        const title = p.get("title") || "Video";
        const poster = p.get("poster") || "";
        const source = p.get("source") || "";
        document.title = title + " · Humanity";
        const bar = document.getElementById("bar");
        bar.innerHTML =
          "<span>" +
          title.replace(/</g, "&lt;") +
          (source ? " · " + source : "") +
          "</span>" +
          (page
            ? ' · <a href="' +
              page.replace(/"/g, "&quot;") +
              '" target="_blank" rel="noopener">Open source</a>'
            : "");

        const stage = document.getElementById("stage");
        // 优先 iframe 官方 embed（多数站点不允许直链 mp4）
        if (embed) {
          const iframe = document.createElement("iframe");
          iframe.src = embed;
          iframe.allow =
            "autoplay; fullscreen; picture-in-picture; encrypted-media";
          iframe.allowFullscreen = true;
          iframe.referrerPolicy = "no-referrer";
          stage.appendChild(iframe);
          return;
        }
        if (page) {
          // 无 embed 时退化为整页
          const iframe = document.createElement("iframe");
          iframe.src = page;
          iframe.allow = "autoplay; fullscreen";
          iframe.allowFullscreen = true;
          stage.appendChild(iframe);
          return;
        }
        stage.innerHTML = '<p class="err">No playable URL</p>';
        // 预留：若日后 HApi 能解析直链 mp4/m3u8，可改用 <video>
        void poster;
      })();
    </script>
  </body>
</html>
