<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0c0f14" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Player · Humanity</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0f14;
        overflow: hidden;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: #e8eef8;
      }
      .stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        .stage.has-media {
          width: 100vh;
          height: 100vw;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%) rotate(90deg);
          transform-origin: center center;
        }
      }
      video,
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
        object-fit: contain;
      }
      .gate {
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .gate h1 {
        margin: 0;
        font-size: 1.1rem;
      }
      .gate p {
        margin: 0;
        color: #8b97ab;
        font-size: 0.9rem;
        max-width: 36rem;
      }
      .quality-tag {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 5;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #e8a05c;
        font-size: 0.72rem;
        font-weight: 700;
        pointer-events: none;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="./js/config.js?v=7"></script>
    <script src="./js/api.js?v=7"></script>
  </head>
  <body>
    <div class="stage" id="stage"></div>
    <script>
      (function () {
        const p = new URLSearchParams(location.search);
        const embedIn = p.get("embed");
        const page = p.get("page");
        const streamIn = p.get("stream");
        const title = p.get("title") || "Video";
        const poster = p.get("poster") || "";
        const source = p.get("source") || "";
        document.title = title + " · Humanity";
        const stage = document.getElementById("stage");
        let hlsObj = null;

        function showGate(msg) {
          stage.classList.remove("has-media");
          stage.innerHTML =
            '<div class="gate"><h1>' +
            String(title).replace(/</g, "&lt;") +
            "</h1><p>" +
            String(msg || "Unable to play").replace(/</g, "&lt;") +
            "</p></div>";
        }

        function showQuality(q) {
          if (!q) return;
          const tag = document.createElement("div");
          tag.className = "quality-tag";
          tag.textContent = q;
          document.body.appendChild(tag);
        }

        function destroyHls() {
          if (hlsObj) {
            try {
              hlsObj.destroy();
            } catch (_) {}
            hlsObj = null;
          }
        }

        function mountVideo(src, fallbackEmbed, quality) {
          destroyHls();
          stage.classList.add("has-media");
          stage.innerHTML = "";
          const video = document.createElement("video");
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          video.setAttribute("playsinline", "");
          if (poster) video.poster = poster;
          let fellBack = false;
          const onFail = function () {
            if (fellBack) return;
            fellBack = true;
            destroyHls();
            if (fallbackEmbed) mountIframe(fallbackEmbed);
            else showGate("Video stream unavailable");
          };
          video.addEventListener("error", onFail);
          stage.appendChild(video);
          showQuality(quality);

          const isHls = /\.m3u8(\?|#|$)/i.test(src);
          if (isHls) {
            if (video.canPlayType("application/vnd.apple.mpegurl")) {
              video.src = src;
            } else if (window.Hls && window.Hls.isSupported()) {
              hlsObj = new window.Hls({
                enableWorker: true,
                startLevel: -1, // auto / highest available
              });
              hlsObj.loadSource(src);
              hlsObj.attachMedia(video);
              hlsObj.on(window.Hls.Events.MANIFEST_PARSED, function (_e, data) {
                // 强制最高档
                if (data && data.levels && data.levels.length) {
                  hlsObj.currentLevel = data.levels.length - 1;
                  const lv = data.levels[data.levels.length - 1];
                  if (lv && lv.height) showQuality(lv.height + "p");
                }
                video.play().catch(function () {});
              });
              hlsObj.on(window.Hls.Events.ERROR, function (_e, data) {
                if (data && data.fatal) onFail();
              });
            } else {
              onFail();
            }
          } else {
            video.src = src;
          }
        }

        function mountIframe(src) {
          destroyHls();
          if (!src) {
            showGate("No playable URL");
            return;
          }
          stage.classList.add("has-media");
          stage.innerHTML = "";
          const iframe = document.createElement("iframe");
          iframe.src = src;
          iframe.allow =
            "autoplay; fullscreen; picture-in-picture; encrypted-media";
          iframe.allowFullscreen = true;
          iframe.referrerPolicy = "no-referrer";
          stage.appendChild(iframe);
        }

        function fixEmbed(url, src, pageUrl) {
          let e = url || "";
          if (/xvideos\.com\/embedframe\/\d+/i.test(e) && pageUrl) {
            const m = String(pageUrl).match(/\/video\.([a-z0-9]+)\//i);
            if (m) e = "https://www.xvideos.com/embedframe/" + m[1];
          }
          if (/pornhub\.com\/embed\/\d+$/i.test(e) && pageUrl) {
            const m = String(pageUrl).match(/viewkey=([a-zA-Z0-9]+)/);
            if (m) e = "https://www.pornhub.com/embed/" + m[1];
          }
          return e;
        }

        async function start() {
          showGate("Loading…");
          let embed = fixEmbed(embedIn, source, page);
          let stream = streamIn;
          let quality = null;

          if (window.HumanityAPI && window.HumanityAPI.getToken && window.HumanityAPI.getToken()) {
            try {
              const d = await window.HumanityAPI.resolvePlay({
                page: page,
                embed: embed,
                source: source,
              });
              if (d && d.stream) stream = d.stream;
              else if (d && d.hls) stream = d.hls;
              if (d && d.embed) embed = d.embed;
              if (d && d.quality) quality = d.quality;
            } catch (_) {}
          }

          if (stream && /\.(mp4|webm|m3u8)(\?|#|$)/i.test(stream)) {
            mountVideo(stream, embed, quality);
            return;
          }
          if (embed) {
            mountIframe(embed);
            return;
          }
          if (page) {
            mountIframe(page);
            return;
          }
          showGate("No playable URL");
        }

        start();
      })();
    </script>
  </body>
</html>
