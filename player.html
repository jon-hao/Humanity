<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="robots" content="noindex,nofollow" />
    <title>Player · Humanity</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0f14;
        overflow: hidden;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: #e8eef8;
      }
      .stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        .stage.has-media {
          width: 100vh;
          height: 100vw;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%) rotate(90deg);
          transform-origin: center center;
        }
      }
      video,
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
        object-fit: contain;
      }
      .gate {
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .gate h1 {
        margin: 0;
        font-size: 1.1rem;
      }
      .gate p {
        margin: 0;
        color: #8b97ab;
        font-size: 0.9rem;
        max-width: 36rem;
      }
      .gate .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        border: 0;
        border-radius: 8px;
        padding: 12px 18px;
        background: linear-gradient(135deg, #c45c26, #a34820);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage"></div>
    <script>
      (function () {
        const p = new URLSearchParams(location.search);
        const embed = p.get("embed");
        const page = p.get("page");
        const stream = p.get("stream");
        const title = p.get("title") || "Video";
        const poster = p.get("poster") || "";
        document.title = title + " · Humanity";
        const stage = document.getElementById("stage");

        function showGate(msg) {
          stage.classList.remove("has-media");
          stage.innerHTML =
            '<div class="gate"><h1>' +
            String(title).replace(/</g, "&lt;") +
            "</h1><p>" +
            String(msg || "Unable to play").replace(/</g, "&lt;") +
            "</p></div>";
        }

        function mountVideo(src) {
          stage.classList.add("has-media");
          stage.innerHTML = "";
          const video = document.createElement("video");
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          video.setAttribute("playsinline", "");
          if (poster) video.poster = poster;
          video.src = src;
          video.addEventListener("error", function () {
            // 直链失败则退回 iframe，绝不跳出本站
            if (embed) mountIframe(embed);
            else showGate("Video stream unavailable");
          });
          stage.appendChild(video);
        }

        function mountIframe(src) {
          stage.classList.add("has-media");
          stage.innerHTML = "";
          const iframe = document.createElement("iframe");
          iframe.src = src;
          iframe.allow =
            "autoplay; fullscreen; picture-in-picture; encrypted-media";
          iframe.allowFullscreen = true;
          iframe.referrerPolicy = "no-referrer";
          iframe.addEventListener("error", function () {
            showGate("Embedded player failed to load");
          });
          stage.appendChild(iframe);
        }

        // 优先原生 video；否则源站 embed iframe。绝不 location 跳到外站。
        if (stream && /\.(mp4|webm|m3u8)(\?|#|$)/i.test(stream)) {
          mountVideo(stream);
          return;
        }
        if (embed) {
          mountIframe(embed);
          return;
        }
        // 没有专用 embed 时，用源页 URL 仍放进 iframe（可能被拒嵌，但留在本页）
        if (page) {
          mountIframe(page);
          return;
        }
        showGate("No playable URL");
      })();
    </script>
  </body>
</html>
