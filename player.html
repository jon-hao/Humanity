<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0c0f14" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Player · Humanity</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0f14;
        overflow: hidden;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: #e8eef8;
      }
      .stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        .stage.has-media {
          width: 100vh;
          height: 100vw;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%) rotate(90deg);
          transform-origin: center center;
        }
      }
      video,
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
        object-fit: contain;
      }
      .gate {
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .gate h1 {
        margin: 0;
        font-size: 1.1rem;
      }
      .gate p {
        margin: 0;
        color: #8b97ab;
        font-size: 0.9rem;
        max-width: 36rem;
      }
    </style>
    <script src="./js/config.js?v=6"></script>
    <script src="./js/api.js?v=6"></script>
  </head>
  <body>
    <div class="stage" id="stage"></div>
    <script>
      (function () {
        const p = new URLSearchParams(location.search);
        const embedIn = p.get("embed");
        const page = p.get("page");
        const streamIn = p.get("stream");
        const title = p.get("title") || "Video";
        const poster = p.get("poster") || "";
        const source = p.get("source") || "";
        document.title = title + " · Humanity";
        const stage = document.getElementById("stage");

        function showGate(msg) {
          stage.classList.remove("has-media");
          stage.innerHTML =
            '<div class="gate"><h1>' +
            String(title).replace(/</g, "&lt;") +
            "</h1><p>" +
            String(msg || "Unable to play").replace(/</g, "&lt;") +
            "</p></div>";
        }

        function mountVideo(src, fallbackEmbed) {
          stage.classList.add("has-media");
          stage.innerHTML = "";
          const video = document.createElement("video");
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          video.setAttribute("playsinline", "");
          if (poster) video.poster = poster;
          video.src = src;
          let fellBack = false;
          video.addEventListener("error", function () {
            if (fellBack) return;
            fellBack = true;
            if (fallbackEmbed) mountIframe(fallbackEmbed);
            else showGate("Video stream unavailable");
          });
          stage.appendChild(video);
        }

        function mountIframe(src) {
          if (!src) {
            showGate("No playable URL");
            return;
          }
          stage.classList.add("has-media");
          stage.innerHTML = "";
          const iframe = document.createElement("iframe");
          iframe.src = src;
          iframe.allow =
            "autoplay; fullscreen; picture-in-picture; encrypted-media";
          iframe.allowFullscreen = true;
          iframe.referrerPolicy = "no-referrer";
          stage.appendChild(iframe);
        }

        function fixEmbed(url, src, pageUrl) {
          let e = url || "";
          // 纠正旧链接：XV 数字 embedframe → 用页面 encoded id
          if (/xvideos\.com\/embedframe\/\d+/i.test(e) && pageUrl) {
            const m = String(pageUrl).match(/\/video\.([a-z0-9]+)\//i);
            if (m) e = "https://www.xvideos.com/embedframe/" + m[1];
          }
          // PH 数字 embed → 从 page 取 viewkey
          if (/pornhub\.com\/embed\/\d+$/i.test(e) && pageUrl) {
            const m = String(pageUrl).match(/viewkey=([a-zA-Z0-9]+)/);
            if (m) e = "https://www.pornhub.com/embed/" + m[1];
          }
          return e;
        }

        async function start() {
          showGate("Loading…");
          let embed = fixEmbed(embedIn, source, page);
          let stream = streamIn;

          // 优先向 HApi 解析直链；失败仍用 embed iframe，绝不跳出本站
          if (window.HumanityAPI && window.HumanityAPI.getToken && window.HumanityAPI.getToken()) {
            try {
              const d = await window.HumanityAPI.resolvePlay({
                page: page,
                embed: embed,
                source: source,
              });
              if (d && d.stream) stream = d.stream;
              if (d && d.embed) embed = d.embed;
            } catch (_) {}
          }

          if (stream && /\.(mp4|webm|m3u8)(\?|#|$)/i.test(stream)) {
            mountVideo(stream, embed);
            return;
          }
          if (embed) {
            mountIframe(embed);
            return;
          }
          if (page) {
            mountIframe(page);
            return;
          }
          showGate("No playable URL");
        }

        start();
      })();
    </script>
  </body>
</html>
